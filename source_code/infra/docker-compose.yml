services:
  postgres:
    image: postgres:17-alpine
    container_name: banquet-hub-postgres
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
      - path: ./.env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-banquet_hub}
      POSTGRES_USER: ${POSTGRES_USER:-banquet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-BanquetHub_Local_2026!}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    ports:
      # Dung cong 5433 tren may host de KHONG dung do voi PostgreSQL cai truc tiep tren Windows (thuong chiem 5432)
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - banquet_hub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  banquet_hub_pgdata:
    name: banquet_hub_pgdata

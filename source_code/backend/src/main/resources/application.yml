spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS_ENABLE:false}
      mail.smtp.ssl.enable: ${MAIL_SSL:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  application:
    name: banquet-hub-api
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/banquet_hub}
    username: ${SPRING_DATASOURCE_USERNAME:banquet_user}
    password: ${SPRING_DATASOURCE_PASSWORD:BanquetHub_Local_2026!}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

management:
  health:
    mail:
      enabled: ${EMAIL_WORKER_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  email:
    worker-enabled: ${EMAIL_WORKER_ENABLED:false}
    from: ${MAIL_FROM:noreply@banquethub.local}
    website-url: ${APP_WEBSITE_URL:${APP_FRONTEND_URL:http://localhost:5173}}
    max-attempts: ${EMAIL_MAX_ATTEMPTS:5}
    poll-delay-ms: ${EMAIL_POLL_DELAY_MS:5000}
  jwt:
    secret: ${APP_JWT_SECRET:BanquetHub_Local_Jwt_Secret_Key_2026_For_HS256_Signing_Min32Bytes}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-flash-lite-latest}
    enabled: ${GEMINI_ENABLED:true}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:30}
    max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:4096}
    max-requests-per-hour: ${AI_MAX_REQUESTS_PER_USER:60}
  seed:
    enabled: ${APP_SEED_ENABLED:true}
    admin-email: ${APP_SEED_ADMIN_EMAIL:admin@banquethub.vn}
    admin-password: ${APP_SEED_ADMIN_PASSWORD:Admin@123}
    employee-email: ${APP_SEED_EMPLOYEE_EMAIL:employee@banquethub.vn}
    employee-password: ${APP_SEED_EMPLOYEE_PASSWORD:Employee@123}
    user-email: ${APP_SEED_USER_EMAIL:user@banquethub.vn}
    user-password: ${APP_SEED_USER_PASSWORD:User@123}

logging:
  level:
    root: INFO
    com.banquethub: INFO
    org.springframework.security: INFO

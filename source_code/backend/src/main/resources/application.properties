spring.application.name=backend
spring.config.import=optional:file:.env.local.properties
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.messages.basename=i18n/messages
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# If omitted locally, the application generates an ephemeral signing key on startup.
jwt.secret=${JWT_SECRET:}
jwt.allow-ephemeral-secret=${JWT_ALLOW_EPHEMERAL_SECRET:false}
jwt.issuer=${JWT_ISSUER:datn-backend}
jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:900}
jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:1296000}
auth.refresh-cookie-secure=${AUTH_REFRESH_COOKIE_SECURE:true}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
twilio.verify.enabled=${TWILIO_VERIFY_ENABLED:false}
twilio.api-key-sid=${TWILIO_API_KEY_SID:}
twilio.api-key-secret=${TWILIO_API_KEY_SECRET:}
twilio.verify.service-sid=${TWILIO_VERIFY_SERVICE_SID:}
twilio.verify.base-url=${TWILIO_VERIFY_BASE_URL:https://verify.twilio.com/v2/Services}
auth.registration-ttl-seconds=${AUTH_REGISTRATION_TTL_SECONDS:600}
phone.default-country-code=${PHONE_DEFAULT_COUNTRY_CODE:+84}
